name: Release

on:
  release:
    types: [ published ]

permissions:
  contents: write   # required to upload release assets and push to gh-pages

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Extract version from build.yaml
        id: ver
        run: |
          VERSION=$(grep '^version:' build.yaml | grep -oP '"[^"]+"' | tr -d '"')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Baking version $VERSION into assembly"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: |
          dotnet build --configuration Release --no-restore \
            /p:Version=${{ steps.ver.outputs.version }} \
            /p:AssemblyVersion=${{ steps.ver.outputs.version }} \
            /p:FileVersion=${{ steps.ver.outputs.version }}

      - name: Package
        run: |
          cd bin/Release/net9.0
          zip Jellyfin.Plugin.WatchSync.zip Jellyfin.Plugin.WatchSync.dll
          md5sum Jellyfin.Plugin.WatchSync.zip | awk '{print $1}' > Jellyfin.Plugin.WatchSync.zip.md5

      # Upload the zip, its MD5, and build.yaml as release assets.
      # build.yaml must be included so jellyfin-plugin-repo-action can read plugin metadata.
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "bin/Release/net9.0/Jellyfin.Plugin.WatchSync.zip" \
            "bin/Release/net9.0/Jellyfin.Plugin.WatchSync.zip.md5" \
            "build.yaml"

      # Regenerate manifest.json on the gh-pages branch of this repository.
      # Jellyfin users add the raw URL for that branch as a plugin repository:
      #   https://raw.githubusercontent.com/NMe84/jellyfin-watch-state-sync-plugin/gh-pages/manifest.json
      - name: Regenerate manifest
        uses: Kevinjil/jellyfin-plugin-repo-action@v0.4.3
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          pagesBranch: gh-pages
          pagesFile: manifest.json
          ignorePrereleases: true

      # Tell the jellyfin-plugins aggregator repo to rebuild its merged manifest.json
      # so the catalog at https://raw.githubusercontent.com/NMe84/jellyfin-plugins/gh-pages/manifest.json
      # stays in sync without needing a manual trigger.
      - name: Trigger jellyfin-plugins aggregator
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.MANIFEST_REPO_PAT }}
          repository: NMe84/jellyfin-plugins
          event-type: plugin-released
