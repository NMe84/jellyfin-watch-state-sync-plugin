# "version" above is a 3-part BASE. One tag ships a build per Jellyfin major,
# and the 4th version component encodes which one (so a 10.x -> 12 server
# upgrade is a real version bump and auto-updates):
#   Jellyfin 10.x -> net9.0,  targetAbi 10.11.9.0, version <base>.10, *-jf10.zip
#   Jellyfin 12   -> net10.0, targetAbi 12.0.0.0,  version <base>.12, *-jf12.zip
# The targetAbi/framework fields below describe the 10.x build only.
targetAbi: "10.11.9.0"
framework: "net9.0"
description: "Synchronize watch states between connected users for linked TV shows"
overview: >
  Links TV shows between groups of two or more users. When any user in a group watches
  or marks an episode as (un)watched, all other users in the group are updated
  automatically. Manage connections from the Watch State Sync page in the admin dashboard.
imageUrl: "https://raw.githubusercontent.com/NMe84/jellyfin-watch-state-sync-plugin/master/sync.png"
