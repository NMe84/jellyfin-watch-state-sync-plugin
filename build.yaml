version: "1.3.0.0"
# One build serves every supported Jellyfin. Compiled net9.0 against the oldest
# supported packages (10.11); Jellyfin assemblies are not strong-named, so it
# binds on Jellyfin 12+ too. targetAbi below is the OLDEST supported server -
# Jellyfin keeps any manifest row where targetAbi <= its own version.
targetAbi: "10.11.9.0"
framework: "net9.0"
description: "Synchronize watch states between connected users for linked TV shows"
overview: >
  Links TV shows between groups of two or more users. When any user in a group watches
  or marks an episode as (un)watched, all other users in the group are updated
  automatically. Manage connections from the Watch State Sync page in the admin dashboard.
imageUrl: "https://raw.githubusercontent.com/NMe84/jellyfin-watch-state-sync-plugin/master/sync.png"
owner: "nme84"
category: "Sync"
artifacts:
  - "Jellyfin.Plugin.WatchSync.dll"
